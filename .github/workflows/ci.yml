name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare hook bridge resource
        shell: pwsh
        run: |
          cargo build -p echoisland-hook-bridge
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          Copy-Item target/debug/echoisland-hook-bridge.exe apps/desktop/src-tauri/resources/echoisland-hook-bridge.exe -Force

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
